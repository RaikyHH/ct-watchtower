[project]
name = "ct-watchtower"
version = "0.1.0"
description = "Certificate Transparency monitoring with a multi-tenant ruleset and phishing scoring"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "flask>=3.0",
    "websocket-client>=1.7",
    "tldextract>=5.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "ruamel.yaml>=0.18",
    "rapidfuzz>=3.6",
    "pyahocorasick>=2.1",
    "httpx>=0.27",
    "idna>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "pip-audit>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
