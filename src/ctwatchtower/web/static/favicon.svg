<!-- A watchtower on a black ground, the light as the one red spot.
     Much black, little ivory, one accent - the same order as in the
     interface.

     Deliberately few and broad shapes: at 16 px every line under 2 px of weight
     disappears, and a slender tower becomes a blob. Hence four blocks, narrower
     from the bottom up, and the lantern at full width. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#0c0b0a"/>
  <g fill="#f0eadc">
    <rect x="4"  y="26" width="24" height="3"/>   <!-- the base -->
    <rect x="7"  y="22" width="18" height="4"/>   <!-- the widening -->
    <rect x="11" y="11" width="10" height="11"/>  <!-- the shaft -->
    <rect x="8"  y="8"  width="16" height="3"/>   <!-- the gallery, cantilevered -->
  </g>
  <rect x="11" y="3" width="10" height="5" fill="#d4482c"/>  <!-- the lantern -->
</svg>
